[package]
name = "riri"
version = "0.6.0"
edition = "2021"
rust-version = "1.75"
description = "A Miri-style undefined-behaviour detector for Rust GPU kernels: run SIMT kernels on the CPU and catch data races, barrier and warp divergence, bad shuffle masks, and uninitialised reads of shared or global memory, understands release and acquire ordering between blocks, and shrinks a failing schedule to the few decisions that cause it."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/rasmsnall/riri"
documentation = "https://docs.rs/riri"
keywords = ["gpu", "cuda", "simt", "race-detection", "miri"]
categories = ["development-tools::testing", "concurrency"]
exclude = ["riri-mir"]

# riri-mir is a rustc driver on a pinned nightly. It is excluded from this
# workspace and from the published package: it cannot build on stable, and
# nothing in the library depends on it.
[workspace]
exclude = ["riri-mir"]

[dependencies]

[dev-dependencies]
