[package]
name = "riri"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A Miri-style undefined-behaviour detector for Rust GPU kernels: run SIMT kernels on the CPU and catch data races, barrier divergence, and uninitialised shared-memory reads."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/rasmsnall/riri"
keywords = ["gpu", "cuda", "simt", "race-detection", "miri"]
categories = ["development-tools::testing", "concurrency"]

