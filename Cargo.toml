[package]
name = "riri"
version = "0.3.1"
edition = "2021"
rust-version = "1.75"
description = "A Miri-style undefined-behaviour detector for Rust GPU kernels: run SIMT kernels on the CPU and catch data races, barrier and warp divergence, bad shuffle masks, and uninitialised shared-memory reads, then shrinks a failing schedule to the few decisions that cause it."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/rasmsnall/riri"
documentation = "https://docs.rs/riri"
keywords = ["gpu", "cuda", "simt", "race-detection", "miri"]
categories = ["development-tools::testing", "concurrency"]

[dependencies]

[dev-dependencies]
