name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.75"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo run --example reduction
      - run: cargo run --example warp_reduce
      - run: cargo run --example shrink
      - run: cargo run --example oxide_kernel
